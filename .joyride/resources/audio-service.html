<!DOCTYPE html>
<html>
<head>
    <title>Audio Control with Local Resources</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100svh;
            display: flex;
            flex-direction: column;
            margin: 0;
            box-sizing: border-box;
        }
        .content {
            flex-shrink: 0;
        }
        .controls { margin: 20px 0; }
        button { margin: 5px; padding: 10px 15px; font-size: 14px; }
        .status { padding: 10px; background: #2d2d30; border-radius: 5px; margin: 10px 0; }
        .success { background: #0e7c0e; }
        .error { background: #a1260d; }
        .log {
            background: #252526;
            padding: 10px;
            border-radius: 5px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            flex: 1;
            min-height: 0;
        }
    </style>
</head>
<body>
    <div class="content">
        <h2>Audio Control with VS Code Local Resources</h2>

        <div class='status' id='status'>Ready to test audio playback</div>

        <div id='enable-audio-section'>
            <p id='enable-audio-message'>You must manually click the Enable Audio button, because browser security.</p>
            <div class='controls'>
                <button id='enable-audio-button' onclick='enableAudio()' style='background: #0078d4; color: white; border: none; padding: 15px 25px; font-size: 16px;'>
                    Enable Audio
                </button>
            </div>
        </div>

        <div id='audio-enabled-section' style='display: none;'>
            <p style='color: #4CAF50; font-weight: bold;'>Audio enabled and ready for playback!</p>
        </div>

        <div class='controls'>
            <button id='play-pause-button' onclick='togglePlayPause()' style='width: 100px;'>Play</button>
            <button onclick='stopAudio()'>Stop</button>
        </div>

        <audio id='audioPlayer' preload='metadata' style='width: 100%; margin: 20px 0;'>
            <source type='audio/mpeg'>
            Your browser does not support the audio element.
        </audio>
    </div>

    <div class='log' id='log'></div>

    <script>
        const vscode = acquireVsCodeApi();
        let audio = document.getElementById('audioPlayer');
        let userGestureComplete = false;

        // Enhanced status tracking
        let audioStatus = {
            userGestureComplete: false,
            audioLoaded: false,        // True only when BOTH data ready AND user gesture complete
            audioDataReady: false,     // Audio data loaded but may not be playable yet
            audioSrc: null,
            playbackState: 'stopped',
            audioDuration: 0,
            audioCurrentTime: 0,
            audioVolume: 1.0,
            lastError: null
        };

        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toISOString().substr(11, 12);
            logDiv.innerHTML += timestamp + ': ' + message + '<br>';
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function updateStatus(message, type = '') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
        }

        function checkAndUpdateReadiness() {
            const wasLoaded = audioStatus.audioLoaded;
            audioStatus.audioLoaded = audioStatus.audioDataReady && audioStatus.userGestureComplete;

            if (!wasLoaded && audioStatus.audioLoaded) {
                log('AUDIO NOW FULLY READY - Both data loaded and user gesture complete');
                audioStatus.playbackState = 'ready';
                updateStatus('Audio ready for playback', 'success');
                updatePlayPauseButton();

                // Notify Joyride that audio is ready to play
                vscode.postMessage({
                    type: 'audioReady',
                    success: true,
                    audioSrc: audioStatus.audioSrc
                });
            }
        }

        function enableAudio() {
            log('User clicked enable audio button - gesture captured');
            userGestureComplete = true;
            audioStatus.userGestureComplete = true;

            // Update UI to show audio is enabled
            document.getElementById('enable-audio-section').style.display = 'none';
            document.getElementById('audio-enabled-section').style.display = 'block';

            // CRITICAL FIX: Unlock audio element for future programmatic playback
            // We must interact with audio element during user gesture to satisfy browser security
            try {
                // Method 1: Try a brief play/pause to unlock the audio element
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        audio.pause();
                        log('Audio element unlocked via play/pause during user gesture');
                    }).catch(err => {
                        log('Audio unlock play failed, trying alternative method: ' + err.message);
                        // Method 2: If play fails, at least call load() to interact with element
                        audio.load();
                        log('Audio element interaction via load() during user gesture');
                    });
                } else {
                    // Fallback for browsers where play() doesn't return promise
                    audio.load();
                    log('Audio element interaction via load() during user gesture');
                }
            } catch (err) {
                log('Audio unlock error: ' + err.message + ' - proceeding anyway');
            }

            updateStatus('Audio enabled and unlocked', 'success');

            // Check if we can now mark audio as fully ready
            checkAndUpdateReadiness();

            vscode.postMessage({type: 'userGestureComplete', success: true, message: 'User clicked enable button and audio unlocked'});
        }

        function loadAudio(audioPath) {
            log('Loading audio: ' + audioPath);
            audioStatus.audioSrc = audioPath;
            audioStatus.playbackState = 'loading';
            audioStatus.audioLoaded = false;
            audioStatus.audioDataReady = false;
            audioStatus.lastError = null;
            audio.src = audioPath;
            audio.load();
            updateStatus('Loading audio...', 'info');
        }

        function playAudio() {
            log('ATTEMPT TO PLAY - Checking prerequisites...');
            log('  User gesture completed: ' + audioStatus.userGestureComplete);
            log('  Audio loaded: ' + audioStatus.audioLoaded);
            log('  Audio source: ' + audioStatus.audioSrc);

            if (!userGestureComplete) {
                const msg = 'Cannot play: Please click Enable Audio first';
                log('  BLOCKED: ' + msg);
                audioStatus.lastError = msg;
                updateStatus(msg, 'error');
                return;
            }

            if (!audioStatus.audioLoaded) {
                const msg = 'Cannot play: Audio not yet loaded/ready';
                log('  BLOCKED: ' + msg);
                audioStatus.lastError = msg;
                updateStatus(msg, 'error');
                return;
            }

            log('  Prerequisites met - calling audio.play()');
            audio.play().then(() => {
                log('Audio play() succeeded');
                audioStatus.playbackState = 'playing';
                updateStatus('Playing', 'success');
                updatePlayPauseButton();
            }).catch(err => {
                const msg = 'Audio play() failed: ' + err.message;
                log('Audio play() error: ' + msg);
                audioStatus.lastError = msg;
                audioStatus.playbackState = 'stopped';
                updateStatus(msg, 'error');
                updatePlayPauseButton();
            });
        }

        function pauseAudio() {
            audio.pause();
            audioStatus.playbackState = 'paused';
            log('Audio paused');
            updateStatus('Paused');
            updatePlayPauseButton();
        }

        function stopAudio() {
            audio.pause();
            audio.currentTime = 0;
            // Explicitly set stopped state (don't rely on pause event)
            audioStatus.playbackState = 'stopped';
            log('Audio stopped');
            updateStatus('Stopped');
            updatePlayPauseButton();
        }

        function togglePlayPause() {
            if (audioStatus.playbackState === 'playing') {
                pauseAudio();
            } else {
                playAudio();
            }
        }

        function updatePlayPauseButton() {
            const button = document.getElementById('play-pause-button');
            if (!button) return;

            switch(audioStatus.playbackState) {
                case 'playing':
                    button.textContent = 'Pause';
                    button.style.background = '#ff9800';
                    break;
                case 'paused':
                    button.textContent = 'Resume';
                    button.style.background = '#4CAF50';
                    break;
                case 'stopped':
                case 'ready':
                    button.textContent = 'Play';
                    button.style.background = '#4CAF50';
                    break;
                case 'loading':
                    button.textContent = 'Loading...';
                    button.style.background = '#757575';
                    button.disabled = true;
                    return; // Don't enable button when loading
                case 'error':
                    button.textContent = 'Error';
                    button.style.background = '#f44336';
                    button.disabled = true;
                    return; // Don't enable button on error
                default:
                    button.textContent = 'Play';
                    button.style.background = '#4CAF50';
                    break;
            }

            // Enable button if audio is loaded and user gesture complete
            button.disabled = !(audioStatus.audioLoaded && audioStatus.userGestureComplete);
        }

        function setVolume(v) {
            if (typeof v !== 'number' || v < 0 || v > 1) {
                const msg = 'Invalid volume value: ' + v;
                log(msg);
                audioStatus.lastError = msg;
                return;
            }
            audio.volume = v;
            audioStatus.audioVolume = v;
            log('Audio volume set to ' + v);
            updateStatus('Volume set to ' + v);
        }

        function getAudioStatus() {
            // Update current values from audio element
            audioStatus.audioCurrentTime = audio.currentTime || 0;
            audioStatus.audioDuration = audio.duration || 0;
            audioStatus.audioVolume = audio.volume || 1.0;

            log('STATUS REQUEST - Current audio status:');
            log('  User gesture: ' + audioStatus.userGestureComplete);
            log('  Audio data ready: ' + audioStatus.audioDataReady);
            log('  Audio loaded (both): ' + audioStatus.audioLoaded);
            log('  Audio source: ' + audioStatus.audioSrc);
            log('  Playback state: ' + audioStatus.playbackState);
            log('  Duration: ' + audioStatus.audioDuration);
            log('  Current time: ' + audioStatus.audioCurrentTime);
            log('  Volume: ' + audioStatus.audioVolume);
            log('  Last error: ' + audioStatus.lastError);

            // Send status back to Joyride
            vscode.postMessage({
                type: 'statusResponse',
                status: audioStatus
            });

            return audioStatus;
        }

        // Audio event listeners with enhanced status tracking
        audio.addEventListener('loadstart', () => {
            log('Audio: loadstart');
            audioStatus.playbackState = 'loading';
            updatePlayPauseButton();
        });

        audio.addEventListener('loadeddata', () => {
            log('Audio: loadeddata');
        });

        audio.addEventListener('canplay', () => {
            log('Audio: canplay - Audio data is ready');
            audioStatus.audioDataReady = true;

            // Check if we can now mark audio as fully ready (data + user gesture)
            checkAndUpdateReadiness();
        });

        audio.addEventListener('playing', () => {
            log('Audio: playing');
            audioStatus.playbackState = 'playing';
            updateStatus('Playing', 'success');
            updatePlayPauseButton();
        });

        audio.addEventListener('pause', () => {
            log('Audio: pause');
            // Only set to 'paused' if we're not already in a terminal state
            if (audioStatus.playbackState !== 'stopped' && audioStatus.playbackState !== 'error') {
                audioStatus.playbackState = 'paused';
                updateStatus('Paused');
                updatePlayPauseButton();

                // Notify Joyride about audio pause (only if it was actually paused, not stopped)
                vscode.postMessage({
                    type: 'audioCompletion',
                    event: 'paused',
                    id: 'default',
                    currentTime: audioStatus.audioCurrentTime,
                    duration: audioStatus.audioDuration
                });
            }
        });

        audio.addEventListener('ended', () => {
            log('Audio: ended');
            audioStatus.playbackState = 'stopped';
            updateStatus('Stopped');
            updatePlayPauseButton();

            // Notify Joyride about audio completion
            log('SENDING audioCompletion event: ended');
            vscode.postMessage({
                type: 'audioCompletion',
                event: 'ended',
                id: 'default',
                currentTime: audioStatus.audioCurrentTime,
                duration: audioStatus.audioDuration
            });
            log('audioCompletion event sent');
        });

        audio.addEventListener('error', (e) => {
            const msg = 'AUDIO ERROR: ' + (e.target.error ? e.target.error.message : 'Unknown error');
            log(msg);
            audioStatus.lastError = msg;
            audioStatus.playbackState = 'error';
            audioStatus.audioDataReady = false;  // Reset data ready flag on error
            audioStatus.audioLoaded = false;     // Reset loaded flag on error
            updateStatus(msg, 'error');
            updatePlayPauseButton();

            // Notify Joyride about the load failure
            vscode.postMessage({
                type: 'audioLoadError',
                success: false,
                error: msg,
                audioSrc: audioStatus.audioSrc
            });

            // Also notify as completion event for play-and-wait functions
            vscode.postMessage({
                type: 'audioCompletion',
                event: 'error',
                id: 'default',
                error: msg,
                audioSrc: audioStatus.audioSrc
            });
        });

        audio.addEventListener('volumechange', () => {
            audioStatus.audioVolume = audio.volume;
            log('Audio: volume changed to ' + audio.volume);
        });

        // Fix 5: Add missing audio event handlers for better state tracking
        audio.addEventListener('waiting', () => {
            log('Audio: waiting - loading more data');
            audioStatus.playbackState = 'loading';
            updateStatus('Loading more data...', 'info');
            updatePlayPauseButton();
        });

        audio.addEventListener('stalled', () => {
            log('Audio: stalled - network issues');
            audioStatus.playbackState = 'stalled';
            updateStatus('Network stalled', 'error');
            updatePlayPauseButton();
        });

        audio.addEventListener('suspend', () => {
            log('Audio: suspend - loading suspended');
            audioStatus.playbackState = 'suspended';
            updateStatus('Loading suspended', 'info');
            updatePlayPauseButton();
        });

        // Message handler from Joyride
        window.addEventListener('message', event => {
            const message = event.data;
            log('Received message: ' + JSON.stringify(message));

            switch(message.command) {
                case 'load':
                    loadAudio(message.audioPath);
                    break;
                case 'play':
                    playAudio();
                    break;
                case 'pause':
                    pauseAudio();
                    break;
                case 'stop':
                    stopAudio();
                    break;
                case 'volume':
                    setVolume(message.volume);
                    break;
                case 'status':
                    getAudioStatus();
                    break;
                default:
                    log('Unknown message command: ' + message.command);
            }
        });

        log('Webview initialized with local resource access');
        vscode.postMessage({type: 'webview-ready', hasAudio: false, userGestureComplete});
    </script>
</body>
</html>
